name: ytdownloadmusics

services:
  web:
    image: ghcr.io/brunosaliba/ytdownloadmusics/web:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    secrets:
      # YouTube cookies (burner account). File must exist (empty = feature off),
      # owned by uid 10001, mode 0400. Never commit it. See .memory-bank/ops/deploy.md.
      - youtube_cookies
    ports:
      - "127.0.0.1:8010:8080"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777,noexec,nosuid,nodev
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 128
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    # IPv6 egress so FORCE_IPV6=1 works when YouTube blocks the host IPv4 (Docker Engine >= 27).
    enable_ipv6: true

secrets:
  youtube_cookies:
    file: ./youtube-cookies.txt
