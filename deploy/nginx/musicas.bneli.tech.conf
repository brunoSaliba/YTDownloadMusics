# Host NGINX site for musicas.bneli.tech -> 127.0.0.1:8010.
# Install as /etc/nginx/sites-available/musicas.bneli.tech (production step);
# run `certbot --nginx -d musicas.bneli.tech` after HTTP routing works.

limit_req_zone $binary_remote_addr zone=musicas_info:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=musicas_dl:10m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=musicas_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name musicas.bneli.tech;
    # After certbot: keep its 301 -> HTTPS and add
    # `add_header Strict-Transport-Security "max-age=31536000" always;` to the 443 block.

    server_tokens off;
    client_max_body_size 1k;
    limit_req_status 429;
    limit_conn_status 429;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /api/info {
        limit_req zone=musicas_info burst=5 nodelay;
        limit_conn musicas_conn 4;
        proxy_read_timeout 60s;
        proxy_pass http://127.0.0.1:8010;
    }

    location /api/download/ {
        limit_req zone=musicas_dl burst=2 nodelay;
        limit_conn musicas_conn 2;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://127.0.0.1:8010;
    }

    location /api/ {
        limit_req zone=musicas_info burst=5 nodelay;
        proxy_pass http://127.0.0.1:8010;
    }

    location / {
        proxy_read_timeout 30s;
        proxy_pass http://127.0.0.1:8010;
    }
}
